name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer commit supersedes an older validation run for the same branch. This
# keeps rapid PR and main iteration from consuming runners on checks that can no
# longer be merged; the newest main commit still validates the complete tree.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static:
    name: Static and generated-file gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node
        with:
          install-ripgrep: true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm invariants
      # Fail closed when a production dependency has a known advisory at any
      # severity; reviewed transitive fixes are pinned in pnpm-workspace.yaml.
      - run: pnpm audit:prod

  tests:
    name: Test suite (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node
      # Vitest's deterministic sharding keeps the full suite while letting
      # independent runners cut the PR's test wall time roughly in half.
      - run: pnpm test --shard=${{ matrix.shard }}/2

  artifacts:
    name: Worker and browser artifact gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node
      # The wrapper preserves clean-checkout semantics even when a developer
      # has a local artifact; CI still runs it before build for the cheapest
      # possible failure.
      - run: pnpm cf-typegen:check
      - run: pnpm build:worker
      # A prior named-chunk optimization passed every static gate but made
      # every deployed route fail under workerd. Boot the built artifact and
      # exercise multiple server entries before accepting its size.
      - run: pnpm smoke:worker
      # build:worker produces both .next and .open-next. Keep these consumers in
      # the same job so the expensive build runs once and no artifact upload or
      # download is needed.
      - run: pnpm bundle:client
      - run: pnpm worker:size
