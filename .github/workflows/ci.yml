name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.8.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # check-invariants.sh fails closed when ripgrep is missing.
      - run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Two independent budgets. The browser bundle and the compressed Worker are
      # different artifacts: the editor is client-only, so it must move the first
      # number and must not move the second.
      - run: pnpm bundle:client
      # Wrangler resolves the self-service binding against the generated OpenNext entrypoint.
      - run: pnpm cf-typegen:check
      - run: pnpm worker:size
