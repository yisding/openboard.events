name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer commit supersedes an older validation run for the same branch. This
# keeps rapid PR and main iteration from consuming runners on checks that can no
# longer be merged; the newest main commit still validates the complete tree.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static:
    name: Static and generated-file gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node
        with:
          install-ripgrep: true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm invariants

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node
      - run: pnpm test

  artifacts:
    name: Worker and browser artifact gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node
      # Run this before build:worker. Once .open-next/worker.js exists,
      # Wrangler resolves the local service binding to that transient module
      # and generates artifact-dependent declarations that are not valid in a
      # clean checkout.
      - run: pnpm cf-typegen:check
      - run: pnpm build:worker
      # build:worker produces both .next and .open-next. Keep these consumers in
      # the same job so the expensive build runs once and no artifact upload or
      # download is needed.
      - run: pnpm bundle:client
      - run: pnpm worker:size
