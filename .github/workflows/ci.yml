name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer commit supersedes an older validation run for the same branch. This
# keeps rapid PR iteration from consuming runners on checks that can no longer
# be merged, while every main push still gets its own complete run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static:
    name: Static and generated-file gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm invariants
      # Wrangler resolves the self-service binding without needing a build.
      - run: pnpm cf-typegen:check

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: pnpm test

  artifacts:
    name: Worker and browser artifact gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: pnpm build:worker
      # build:worker produces both .next and .open-next. Keep these consumers in
      # the same job so the expensive build runs once and no artifact upload or
      # download is needed.
      - run: pnpm bundle:client
      - run: pnpm worker:size
