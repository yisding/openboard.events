name: DMARC operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read status or idempotently enable aggregate reports
        required: true
        type: choice
        default: status
        options: [status, enable-reporting]

permissions:
  contents: read

jobs:
  dmarc:
    name: ${{ inputs.operation }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: dmarc-operations
      cancel-in-progress: false
    env:
      CLOUDFLARE_DMARC_API_TOKEN: ${{ secrets.CLOUDFLARE_DMARC_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Validate DMARC credentials
        run: |
          test -n "$CLOUDFLARE_DMARC_API_TOKEN" || {
            echo "::error::CLOUDFLARE_DMARC_API_TOKEN is not configured in the production environment"
            exit 1
          }
          [[ "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]] || {
            echo "::error::CLOUDFLARE_ZONE_ID must be the production zone's 32-character ID"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 11.21.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ${{ inputs.operation }}
        run: pnpm dmarc:manage "${{ inputs.operation }}"
