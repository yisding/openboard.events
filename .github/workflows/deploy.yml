name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        default: preview
        options: [preview, production]

# The reusable workflow owns environment-scoped variables and secrets. This
# caller owns promotion order: production has an explicit dependency on a
# successful deployment of the exact same commit to preview.
permissions:
  contents: read

jobs:
  preview:
    name: Preview canary
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: preview
      deploy_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      automatic: ${{ github.event_name == 'workflow_run' }}
    secrets: inherit

  production:
    name: Production promotion
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    needs: preview
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      deploy_sha: ${{ github.sha }}
      automatic: false
    secrets: inherit
