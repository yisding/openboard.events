name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        default: preview
        options: [preview, production]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.PRODUCTION_DEPLOY_ENABLED == '1')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_ALLOWLIST: ${{ vars.EMAIL_ALLOWLIST }}
      NEXT_PUBLIC_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 11.8.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations with the direct Neon URL
        run: pnpm db:migrate
      - name: Deploy web before jobs
        run: pnpm deploy:web:${{ inputs.environment || 'production' }}
      - name: Deploy jobs against the matching web URL
        run: pnpm deploy:jobs:${{ inputs.environment || 'production' }}
      - name: Smoke test the deployed web worker
        run: bash scripts/post-deploy-smoke.sh "$APP_BASE_URL"
