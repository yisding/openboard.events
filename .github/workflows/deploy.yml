name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        default: preview
        options: [preview, production]

jobs:
  targets:
    # A merge to main deploys preview and nothing else. Production stays a
    # manual dispatch until PRODUCTION_DEPLOY_ENABLED=1, and even then it
    # trails preview rather than deploying beside it.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environments: ${{ steps.pick.outputs.environments }}
    steps:
      - name: Pick the environments this event deploys
        id: pick
        env:
          DISPATCH_ENV: ${{ inputs.environment }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          if [[ -n "$DISPATCH_ENV" ]]; then
            environments="[\"$DISPATCH_ENV\"]"
          elif [[ "$PRODUCTION_DEPLOY_ENABLED" == "1" ]]; then
            environments='["preview","production"]'
          else
            environments='["preview"]'
          fi

          # Never empty: an empty matrix vector fails the run rather than
          # skipping it, and the job-level `if` already discards failed CI.
          echo "environments=$environments" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying $environments"

  deploy:
    needs: targets
    strategy:
      # Sequential so production deploys only behind a preview that survived
      # its own migration, deploy, and smoke test.
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: ${{ fromJSON(needs.targets.outputs.environments) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_ALLOWLIST: ${{ vars.EMAIL_ALLOWLIST }}
      NEXT_PUBLIC_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_ENV: ${{ matrix.environment }}
      SMOKE_EVENT_SLUG: ${{ vars.SMOKE_EVENT_SLUG || 'ai-engineer-sandbox-event' }}
      SMOKE_EVENT_ID: ${{ vars.SMOKE_EVENT_ID }}
      SMOKE_FORM_ID: ${{ vars.SMOKE_FORM_ID }}
      SMOKE_HEADSHOT_FILE_ID: ${{ vars.SMOKE_HEADSHOT_FILE_ID }}
    steps:
      - name: Suppress stale automatic deployments
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$DEPLOY_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Skipping stale deployment for $DEPLOY_SHA; main is $current_sha"
          echo "current=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.freshness.outputs.current == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.freshness.outputs.current == 'true'
        with: { version: 11.8.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.freshness.outputs.current == 'true'
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: steps.freshness.outputs.current == 'true'
      - name: Validate protected deployment inputs
        if: steps.freshness.outputs.current == 'true'
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL_DIRECT APP_BASE_URL R2_ACCOUNT_ID SMOKE_EVENT_ID SMOKE_FORM_ID SMOKE_HEADSHOT_FILE_ID)
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::protected environment is missing required deploy inputs: ${missing[*]}"
            exit 1
          fi
      - name: Verify remote Worker secret inventories
        if: steps.freshness.outputs.current == 'true'
        run: |
          pnpm deploy:preflight web "$DEPLOY_ENV"
          pnpm deploy:preflight jobs "$DEPLOY_ENV"
      - name: Apply migrations with the direct Neon URL
        if: steps.freshness.outputs.current == 'true'
        run: pnpm db:migrate
      - name: Deploy web before jobs
        if: steps.freshness.outputs.current == 'true'
        run: pnpm deploy:web:${{ matrix.environment }}
      - name: Deploy jobs against the matching web URL
        if: steps.freshness.outputs.current == 'true'
        run: pnpm deploy:jobs:${{ matrix.environment }}
      - name: Smoke test the deployed web worker
        if: steps.freshness.outputs.current == 'true'
        run: |
          smoke_args=(--strict)
          if [[ "$DEPLOY_ENV" == "production" ]]; then
            smoke_args+=(--production)
          fi
          bash scripts/post-deploy-smoke.sh "$APP_BASE_URL" "${smoke_args[@]}"
