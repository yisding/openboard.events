name: Set up Node and pnpm
description: Install the pinned toolchain and frozen dependencies for a CI job

inputs:
  install-ripgrep:
    description: Install ripgrep for the invariant scan
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11.21.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install ripgrep
      if: inputs.install-ripgrep == 'true'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
