name: Set up Node and pnpm
description: Install the pinned toolchain and frozen dependencies for a CI job

inputs:
  install-ripgrep:
    description: Install ripgrep for the invariant scan
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 11.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install ripgrep
      if: inputs.install-ripgrep == 'true'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
